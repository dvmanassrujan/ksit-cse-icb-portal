<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSE (ICB) Department Integrated Academic and Information Portal | KSIT Bengaluru</title>
  <meta name="description" content="Centralized academic management portal for the Department of Computer Science & Engineering – ICB at K. S. Institute of Technology (KSIT), Bengaluru.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- LEFT NAVY SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="college-crest">
          <img src="/assets/logo.png" alt="KSIT Crest" onerror="this.src='/assets/raw/WhatsApp Image 2026-09-29 at 4.35.47 PM.jpeg'">
        </div>
        <div class="college-meta">
          <h2>KSIT</h2>
          <p>K. S. Institute of Technology<br>Bengaluru</p>
        </div>
      </div>

      <div class="dept-tag-banner">
        <div class="dept-name">
          <span>CSE (ICB)</span>
        </div>
        <div class="portal-desc">
          ✦ Department Integrated<br>Academic and Information Portal
        </div>
      </div>

      <!-- Navigation Links Container -->
      <nav class="sidebar-nav" id="sidebarNavContainer"></nav>

      <!-- Bottom Motivational Card -->
      <div class="sidebar-bottom-card" id="sidebarBottomCard">
        <h4>Better Everyday</h4>
        <p>Small steps lead to big dreams.</p>
      </div>

      <div class="sidebar-footer-text">
        KSIT • CSE (ICB) Portal &nbsp;|&nbsp; v1.0.0
      </div>
    </aside>

    <!-- RIGHT MAIN CONTENT -->
    <main class="main-content">
      <!-- TOP STICKY HEADER -->
      <header class="top-header">
        <!-- Search Input -->
        <div class="header-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="globalSearchInput" placeholder="Search for classes, notes, events, notices...">
        </div>

        <!-- Role Switcher Pills (Instant Toggle for Evaluation & Demo) -->
        <div class="role-switch-pills">
          <button class="role-pill-btn active" data-role="student">
            <span>🎓</span> Student
          </button>
          <button class="role-pill-btn" data-role="teacher">
            <span>👨‍🏫</span> Teacher
          </button>
          <button class="role-pill-btn" data-role="department">
            <span>🏛️</span> Department
          </button>
          <button class="role-pill-btn" data-role="survey">
            <span>📊</span> Survey Insights
          </button>
        </div>

        <!-- Header Actions: Database Badge, Notifications, User Menu -->
        <div class="header-actions">
          <div class="db-status-badge" id="dbStatusBadge" title="Click to view database connection details">
            <span class="db-pulse-dot"></span>
            <span>Database: Loading...</span>
          </div>

          <div class="notif-bell-btn" id="notifBellBtn" title="View Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span class="notif-badge">3</span>
          </div>

          <div class="user-profile-menu" id="userProfileMenu">
            <!-- Dynamic profile populated by app.js -->
          </div>
        </div>
      </header>

      <!-- PAGE CONTENT AREA -->
      <section class="page-container" id="mainContentArea">
        <!-- Injected dynamically by app.js -->
      </section>
    </main>
  </div>

  <!-- REUSABLE MODAL BACKDROP & DIALOG -->
  <div class="modal-backdrop" id="genericModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="genericModalTitle">Modal Title</h3>
        <button class="modal-close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div id="genericModalBody">
        <!-- Content injected dynamically -->
      </div>
    </div>
  </div>

  <!-- FLOATING TOAST NOTIFICATIONS -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- APPLICATION JAVASCRIPT -->
  <script src="/js/app.js"></script>
</body>
</html>
